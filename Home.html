
<html>
<html>
<head>
    <title>Employee Form</title>
</head>
<body>

    <h2>Employee System</h2>

    <form id="myForm">
        ID: <input type="number" id="id" required><br><br>
        Name: <input type="text" id="name" required><br><br>
        Role: <input type="text" id="role" required><br><br>
        Salary: <input type="number" id="salary" required><br><br>

        <button type="submit">Submite</button>
    </form>

    <h2>Employee Details</h2>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Role</th>
                <th>Salary</th>
            </tr>
        </thead>

        <tbody id="data"></tbody>
    </table>

    <script>
        document.getElementById("myForm").onsubmit = function(event) {
            event.preventDefault();

            let id = document.getElementById("id").value;
            let name = document.getElementById("name").value;
            let role = document.getElementById("role").value;
            let salary = document.getElementById("salary").value;

            let table = document.getElementById("data");
            let row = table.insertRow();

            row.insertCell(0).innerHTML = id;
            row.insertCell(1).innerHTML = name;
            row.insertCell(2).innerHTML = role;
            row.insertCell(3).innerHTML = salary;

            document.getElementById("myForm").reset();
        };
    </script>

</body>
</html>
